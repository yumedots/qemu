name: build qemu

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/buildQemu.yml
      - meson.build
      - meson_options.txt
      - ui/**
      - accel/hvf/**
      - hw/display/**
      - include/ui/**

permissions:
  contents: write

concurrency:
  group: build-qemu-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  keg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: dependencies
        run: |
          brew tap milesbuckton/qemu-virgl
          brew trust milesbuckton/qemu-virgl || true
          brew install --formula meson ninja pkg-config coreutils libtool dtc dbus python
          brew install --formula glib gnutls nettle jpeg libpng libslirp libssh libusb lzo ncurses pixman snappy vde
          brew install --formula milesbuckton/qemu-virgl/libangle
          brew install --formula milesbuckton/qemu-virgl/libepoxy-angle
          brew install --formula milesbuckton/qemu-virgl/virglrenderer
          echo "$(brew --prefix python)/libexec/bin" >> "$GITHUB_PATH"
          for keg in libangle libepoxy-angle virglrenderer vde libssh ncurses; do
            echo "${keg//-/_}=$(brew --prefix "$keg")" >> "$GITHUB_ENV"
          done
          echo "PKG_CONFIG_PATH=$(brew --prefix libepoxy-angle)/lib/pkgconfig:$(brew --prefix vde)/lib/pkgconfig:$(brew --prefix libssh)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: toolchain
        run: |
          set -euo pipefail
          python3 -c 'import tomllib'
          python3 --version
          pkg-config --modversion epoxy
          test -f "$vde/include/libvdeplug.h"
          test -f "$libssh/include/libssh/libssh.h"

      - name: build
        run: |
          set -euo pipefail
          prefix=$PWD/stage/qemu/master
          ./configure \
            --prefix="$prefix" \
            --disable-bsd-user \
            --disable-guest-agent \
            --disable-sdl \
            --disable-gtk \
            --enable-cocoa \
            --enable-opengl \
            --enable-virglrenderer \
            --enable-curses \
            --enable-libssh \
            --enable-slirp \
            --enable-vde \
            --enable-fdt=system \
            --enable-trace-backends=log,simple \
            --enable-malloc=system \
            --target-list=aarch64-softmmu \
            --extra-cflags="-I$libangle/include -I$libepoxy_angle/include -I$virglrenderer/include -I$vde/include -I$libssh/include -I$ncurses/include -DNCURSES_WIDECHAR=1" \
            --extra-ldflags="-L$libangle/lib -L$libepoxy_angle/lib -L$virglrenderer/lib -L$vde/lib -L$libssh/lib -L$ncurses/lib -Wl,-rpath,$libangle/lib -Wl,-rpath,$libepoxy_angle/lib -Wl,-rpath,$virglrenderer/lib"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: sign for hvf
        run: |
          set -euo pipefail
          cat > hypervisor.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.hypervisor</key>
            <true/>
          </dict>
          </plist>
          PLIST
          for binary in stage/qemu/master/bin/qemu-system-*; do
            codesign --force --sign - --entitlements hypervisor.entitlements "$binary"
            codesign -d --entitlements - "$binary" | grep -q com.apple.security.hypervisor
          done

      - name: opengl comes up over dbus
        run: |
          set -euo pipefail
          export DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address=1)
          qemu=stage/qemu/master/bin/qemu-system-aarch64
          $qemu --version
          $qemu -nodefaults -machine none -display dbus,gl=on -device virtio-gpu-gl-pci -S >/tmp/gl.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/gl.log
            echo "the built qemu cannot bring up an opengl display" >&2
            exit 1
          fi
          kill "$pid"

      - name: package
        run: |
          set -euo pipefail
          tar czf qemu-master.arm64_tahoe.tgz -C stage qemu
          shasum -a 256 qemu-master.arm64_tahoe.tgz | tee qemu-master.arm64_tahoe.tgz.sha256

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "qemu built from $tag" \
            qemu-master.arm64_tahoe.tgz \
            qemu-master.arm64_tahoe.tgz.sha256 \
            || gh release upload "$tag" --clobber \
                 qemu-master.arm64_tahoe.tgz \
                 qemu-master.arm64_tahoe.tgz.sha256
